version: '3.8'

services:
  # ── Infraestructura ──────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 15s
      timeout: 10s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  # ── Bases de Datos PostgreSQL ────────────────────────────────────
  postgres_alojamientos:
    image: postgres:15-alpine
    container_name: postgres_alojamientos
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: db_alojamientos
    ports:
      - "5432:5432"
    volumes:
      - pg_alojamientos:/var/lib/postgresql/data
      - ../DB_Scripts/02_DB_Alojamientos.sql:/docker-entrypoint-initdb.d/02_init.sql
      - ../DB_Scripts/06_Update_AlojaExpress.sql:/docker-entrypoint-initdb.d/06_update.sql
      - ../DB_Scripts/09_Alter_Calendario_Disponibilidad_Compartida.sql:/docker-entrypoint-initdb.d/09_disponibilidad_compartida.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_alojamientos"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_facturacion:
    image: postgres:15-alpine
    container_name: postgres_facturacion
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: db_facturacion
    ports:
      - "5433:5432"
    volumes:
      - pg_facturacion:/var/lib/postgresql/data
      - ../DB_Scripts/04_DB_Facturacion.sql:/docker-entrypoint-initdb.d/04_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_facturacion"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_reservas:
    image: postgres:15-alpine
    container_name: postgres_reservas
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: db_reservas
    ports:
      - "5434:5432"
    volumes:
      - pg_reservas:/var/lib/postgresql/data
      - ../DB_Scripts/03_DB_Reservas.sql:/docker-entrypoint-initdb.d/03_init.sql
      - ../DB_Scripts/08_Alter_Reservas_ExternalId.sql:/docker-entrypoint-initdb.d/08_external_id.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_reservas"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_usuarios:
    image: postgres:15-alpine
    container_name: postgres_usuarios
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: db_usuarios
    ports:
      - "5435:5432"
    volumes:
      - pg_usuarios:/var/lib/postgresql/data
      - ../DB_Scripts/01_DB_Usuarios.sql:/docker-entrypoint-initdb.d/01_init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_usuarios"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres_booking:
    image: postgres:15-alpine
    container_name: postgres_booking
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: db_booking
    ports:
      - "5436:5432"
    volumes:
      - pg_booking:/var/lib/postgresql/data
      - ../DB_Scripts/script_booking.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_booking"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Microservicios ───────────────────────────────────────────────
  alojamientos-api:
    build:
      context: .
      dockerfile: Dockerfile.Alojamientos
    container_name: alojamientos-api
    restart: unless-stopped
    depends_on:
      postgres_alojamientos:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ConexionAlojamientos: "Host=postgres_alojamientos;Port=5432;Database=db_alojamientos;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-password};"
      ConnectionStrings__RabbitMQ: "amqps://rtiqdlfy:u7i-CTdpjA4fvRvRAPsLD1Kxu6W-qfo0@leopard.lmq.cloudamqp.com/rtiqdlfy"
      Cloudinary__CloudName: ${Cloudinary__CloudName:-}
      Cloudinary__ApiKey: ${Cloudinary__ApiKey:-}
      Cloudinary__ApiSecret: ${Cloudinary__ApiSecret:-}

  facturacion-api:
    build:
      context: .
      dockerfile: Dockerfile.Facturacion
    container_name: facturacion-api
    restart: unless-stopped
    depends_on:
      postgres_facturacion:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ConexionFacturacion: "Host=postgres_facturacion;Port=5432;Database=db_facturacion;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-password};"
      ConnectionStrings__RabbitMQ: "amqps://rtiqdlfy:u7i-CTdpjA4fvRvRAPsLD1Kxu6W-qfo0@leopard.lmq.cloudamqp.com/rtiqdlfy"

  reservas-api:
    build:
      context: .
      dockerfile: Dockerfile.Reservas
    container_name: reservas-api
    restart: unless-stopped
    depends_on:
      postgres_reservas:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ConexionReservas: "Host=postgres_reservas;Port=5432;Database=db_reservas;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-password};"
      ConnectionStrings__RabbitMQ: "amqps://rtiqdlfy:u7i-CTdpjA4fvRvRAPsLD1Kxu6W-qfo0@leopard.lmq.cloudamqp.com/rtiqdlfy"
      GrpcUrls__Alojamientos: "http://alojamientos-api:8080"

  usuarios-api:
    build:
      context: .
      dockerfile: Dockerfile.Usuarios
    container_name: usuarios-api
    restart: unless-stopped
    depends_on:
      postgres_usuarios:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ConexionUsuarios: "Host=postgres_usuarios;Port=5432;Database=db_usuarios;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-password};"

  booking-integration-api:
    build:
      context: .
      dockerfile: Dockerfile.BookingIntegration
    container_name: booking-integration-api
    restart: unless-stopped
    depends_on:
      postgres_booking:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__ConexionBooking: "Host=postgres_booking;Port=5432;Database=db_booking;Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-password};"
      ConnectionStrings__RabbitMQ: "amqps://rtiqdlfy:u7i-CTdpjA4fvRvRAPsLD1Kxu6W-qfo0@leopard.lmq.cloudamqp.com/rtiqdlfy"
      Microservices__UsuariosUrl: "http://usuarios-api:8080"
      Microservices__ReservasUrl: "http://reservas-api:8080"
      Microservices__AlojamientosUrl: "http://alojamientos-api:8080"

  # ── API Gateway (público) ────────────────────────────────────────
  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile.ApiGateway
    container_name: api-gateway
    restart: unless-stopped
    ports:
      - "5028:8080"
    depends_on:
      - alojamientos-api
      - facturacion-api
      - reservas-api
      - usuarios-api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Microservices__UsuariosUrl: "http://usuarios-api:8080"
      Microservices__AlojamientosUrl: "http://alojamientos-api:8080"
      Microservices__ReservasUrl: "http://reservas-api:8080"
      Microservices__FacturacionUrl: "http://facturacion-api:8080"
      ReverseProxy__Clusters__reservas-cluster__Destinations__destination1__Address: "http://reservas-api:8080/"
      ReverseProxy__Clusters__alojamientos-cluster__Destinations__destination1__Address: "http://alojamientos-api:8080/"
      ReverseProxy__Clusters__usuarios-cluster__Destinations__destination1__Address: "http://usuarios-api:8080/"
      ReverseProxy__Clusters__facturacion-cluster__Destinations__destination1__Address: "http://facturacion-api:8080/"
      BookingIntegration__ApiKey: ${BOOKING_API_KEY:-alojaexpress_booking_secret_key_12345}
      BookingIntegration__HmacSecret: ${BOOKING_HMAC_SECRET:-alojaexpress_booking_hmac_secret_67890}
      ConnectionStrings__RabbitMQ: "amqps://rtiqdlfy:u7i-CTdpjA4fvRvRAPsLD1Kxu6W-qfo0@leopard.lmq.cloudamqp.com/rtiqdlfy"
      BookingIntegration__BookingApiUrl: "http://booking-integration-api:8080"
      Microservices__BookingIntegrationUrl: "http://booking-integration-api:8080"
      Cloudinary__CloudName: ${Cloudinary__CloudName:-}
      Cloudinary__ApiKey: ${Cloudinary__ApiKey:-}
      Cloudinary__ApiSecret: ${Cloudinary__ApiSecret:-}

  # ── Frontend ────────────────────────────────────────────────────
  frontend:
    build:
      context: ../
      dockerfile: Dockerfile.front
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api/v1}
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api-gateway

volumes:
  pg_alojamientos:
  pg_facturacion:
  pg_reservas:
  pg_usuarios:
  pg_booking:
  rabbitmq_data:
