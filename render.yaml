# render.yaml — Blueprint de despliegue AlojaExpress en Render.com
# Documentación: https://render.com/docs/blueprint-spec

services:
  # ── API Gateway (único servicio público) ──────────────────────────
  - type: web
    name: alojaexpress-gateway
    runtime: docker
    dockerfilePath: ./AlojamientoPrototipo/Dockerfile.ApiGateway
    dockerContext: ./AlojamientoPrototipo
    plan: free
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: PORT
        value: 8080
      - key: Microservices__UsuariosUrl
        fromService:
          name: alojaexpress-usuarios
          type: pserv
          property: hostport
      - key: Microservices__AlojamientosUrl
        fromService:
          name: alojaexpress-alojamientos
          type: pserv
          property: hostport
      - key: Microservices__ReservasUrl
        fromService:
          name: alojaexpress-reservas
          type: pserv
          property: hostport
      - key: Microservices__FacturacionUrl
        fromService:
          name: alojaexpress-facturacion
          type: pserv
          property: hostport
      - key: ReverseProxy__Clusters__reservas-cluster__Destinations__destination1__Address
        fromService:
          name: alojaexpress-reservas
          type: pserv
          property: hostport
      - key: ReverseProxy__Clusters__alojamientos-cluster__Destinations__destination1__Address
        fromService:
          name: alojaexpress-alojamientos
          type: pserv
          property: hostport
      - key: ReverseProxy__Clusters__usuarios-cluster__Destinations__destination1__Address
        fromService:
          name: alojaexpress-usuarios
          type: pserv
          property: hostport
      - key: ReverseProxy__Clusters__facturacion-cluster__Destinations__destination1__Address
        fromService:
          name: alojaexpress-facturacion
          type: pserv
          property: hostport
      - key: BookingIntegration__ApiKey
        sync: false
      - key: BookingIntegration__HmacSecret
        sync: false
      - key: ConnectionStrings__RabbitMQ
        sync: false

  # ── Usuarios API (servicio privado) ──────────────────────────────
  - type: pserv
    name: alojaexpress-usuarios
    runtime: docker
    dockerfilePath: ./AlojamientoPrototipo/Dockerfile.Usuarios
    dockerContext: ./AlojamientoPrototipo
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: PORT
        value: 8080
      - key: ConnectionStrings__ConexionUsuarios
        sync: false

  # ── Alojamientos API (servicio privado) ──────────────────────────
  - type: pserv
    name: alojaexpress-alojamientos
    runtime: docker
    dockerfilePath: ./AlojamientoPrototipo/Dockerfile.Alojamientos
    dockerContext: ./AlojamientoPrototipo
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: PORT
        value: 8080
      - key: ConnectionStrings__ConexionAlojamientos
        sync: false
      - key: ConnectionStrings__RabbitMQ
        sync: false

  # ── Reservas API (servicio privado) ──────────────────────────────
  - type: pserv
    name: alojaexpress-reservas
    runtime: docker
    dockerfilePath: ./AlojamientoPrototipo/Dockerfile.Reservas
    dockerContext: ./AlojamientoPrototipo
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: PORT
        value: 8080
      - key: ConnectionStrings__ConexionReservas
        sync: false
      - key: ConnectionStrings__RabbitMQ
        sync: false

  # ── Facturacion API (servicio privado) ────────────────────────────
  - type: pserv
    name: alojaexpress-facturacion
    runtime: docker
    dockerfilePath: ./AlojamientoPrototipo/Dockerfile.Facturacion
    dockerContext: ./AlojamientoPrototipo
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ASPNETCORE_URLS
        value: http://+:8080
      - key: PORT
        value: 8080
      - key: ConnectionStrings__ConexionFacturacion
        sync: false
      - key: ConnectionStrings__RabbitMQ
        sync: false
