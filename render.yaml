services:
  - type: web
    name: alojamientos-api
    env: docker
    dockerContext: ./AlojamientoPrototipo
    dockerfilePath: ./AlojamientoPrototipo/Dockerfile.Alojamientos
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

  - type: web
    name: facturacion-api
    env: docker
    dockerContext: ./AlojamientoPrototipo
    dockerfilePath: ./AlojamientoPrototipo/Dockerfile.Facturacion
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

  - type: web
    name: reservas-api
    env: docker
    dockerContext: ./AlojamientoPrototipo
    dockerfilePath: ./AlojamientoPrototipo/Dockerfile.Reservas
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: GrpcUrls__Alojamientos
        fromService:
          type: web
          name: alojamientos-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: usuarios-api
    env: docker
    dockerContext: ./AlojamientoPrototipo
    dockerfilePath: ./AlojamientoPrototipo/Dockerfile.Usuarios
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production

  - type: web
    name: api-gateway
    env: docker
    dockerContext: ./AlojamientoPrototipo
    dockerfilePath: ./AlojamientoPrototipo/Dockerfile.ApiGateway
    plan: free
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ReverseProxy__Clusters__alojamientos-cluster__Destinations__destination1__Address
        fromService:
          type: web
          name: alojamientos-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: ReverseProxy__Clusters__reservas-cluster__Destinations__destination1__Address
        fromService:
          type: web
          name: reservas-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: ReverseProxy__Clusters__usuarios-cluster__Destinations__destination1__Address
        fromService:
          type: web
          name: usuarios-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: ReverseProxy__Clusters__facturacion-cluster__Destinations__destination1__Address
        fromService:
          type: web
          name: facturacion-api
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: booking-frontend
    env: docker
    dockerContext: .
    dockerfilePath: ./Dockerfile.front
    plan: free
    envVars:
      - key: API_GATEWAY_URL
        fromService:
          type: web
          name: api-gateway
          envVarKey: RENDER_EXTERNAL_URL
      - key: API_GATEWAY_HOST
        fromService:
          type: web
          name: api-gateway
          envVarKey: RENDER_EXTERNAL_HOSTNAME
